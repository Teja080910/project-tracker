name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_URL: https://tracker.arkasodhara.tech
  NEXT_PUBLIC_AUTH_URL: https://auth.arkasodhara.tech
  NEXT_PUBLIC_WS_URL: wss://tracker.arkasodhara.tech/ws
  NEXT_PUBLIC_FILES_URL: https://files.arkasodhara.tech/pt-task-screenshots
  NEXT_PUBLIC_APP_URL: https://tracker.arkasodhara.tech
  NEXT_PUBLIC_APP_NAME: Arkasodhara

jobs:
  deploy:
    name: Deploy to platform VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build on x64
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.TRACKER_VAPID_PUBLIC_KEY }}
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.TRACKER_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "${{ secrets.TRACKER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env*' \
            --exclude '*.log' \
            --exclude '*.tsbuildinfo' \
            ./ "${{ secrets.TRACKER_USER }}@${{ secrets.TRACKER_HOST }}:/opt/aso/project-tracker/"

      - name: Sync prebuilt Next.js output
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            --exclude 'cache' \
            .next/ "${{ secrets.TRACKER_USER }}@${{ secrets.TRACKER_HOST }}:/opt/aso/project-tracker/.next/"

      - name: Restart
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "${{ secrets.TRACKER_USER }}@${{ secrets.TRACKER_HOST }}" \
            "cd /opt/aso/server/deploy && ./scripts/render-env.sh && docker compose -f docker-compose.all.yml up -d --no-build web-project-tracker && docker compose -f docker-compose.all.yml restart web-project-tracker"

      - name: Done
        run: echo "Deployed https://tracker.arkasodhara.tech"
