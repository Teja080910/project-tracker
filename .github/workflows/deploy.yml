name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to platform VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.TRACKER_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "${{ secrets.TRACKER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env*' \
            --exclude '*.log' \
            --exclude '*.tsbuildinfo' \
            ./ "${{ secrets.TRACKER_USER }}@${{ secrets.TRACKER_HOST }}:/opt/aso/project-tracker/"

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "${{ secrets.TRACKER_USER }}@${{ secrets.TRACKER_HOST }}" \
            "cd /opt/aso/server/deploy && ./scripts/render-env.sh && docker compose -f docker-compose.all.yml up -d --build web-project-tracker"

      - name: Done
        run: echo "Deployed https://tracker.arkasodhara.tech"
